[project]
name = "spsaas-api"
version = "0.1.0"
description = "SPSAAS API — FastAPI async backend for monitoring SaaS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.32",
    "sqlalchemy==2.0.54",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "redis==5.0.*",
    "arq==0.28.0",
    "httpx==0.28.1",
    "structlog==26.1.0",
    "python-dotenv==1.2.3",
    "email-validator==2.3.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite==0.22.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.16.8",
    "mypy==2.3.1",
    "types-passlib==1.7.*",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "alembic*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app"]
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "ANN", "T20", "PTH", "ERA", "PL", "TRY", "SIM", "RET"]
ignore = ["ARG001", "ARG002", "B008", "PLW0603", "PTH123", "TRY003", "SIM117", "E501", "E402"]

# Style/lint opinion exclusions (pragmatic gate, see odd/tasks/quality-gate.md):
# - tests: HTTP status codes as magic values are idiomatic.
# - scripts: CLI tools legitimately print; seed_admin is a dev script (large main).
# - repositories/base.py: Generic repository needs Any for **kwargs (filters, data).
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]
"scripts/*" = ["T201", "PLR2004", "PLR0915"]
"app/repositories/base.py" = ["ANN401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
namespace_packages = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]