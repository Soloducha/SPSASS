[project]
name = "spsaas-api"
version = "0.1.0"
description = "SPSAAS API — FastAPI async backend for monitoring SaaS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.32.*",
    "pydantic==2.9.*",
    "pydantic-settings==2.5.*",
    "python-jose[cryptography]==3.3.*",
    "passlib[bcrypt]==1.7.*",
    "python-multipart==0.0.*",
    "sqlalchemy==2.0.*",
    "asyncpg==0.29.*",
    "alembic==1.13.*",
    "redis==5.0.*",
    "arq==0.23.*",
    "httpx==0.27.*",
    "structlog==24.1.*",
    "python-dotenv==1.0.*",
    "email-validator==2.1.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.*",
    "pytest-asyncio==0.23.*",
    "pytest-cov==5.0.*",
    "httpx==0.27.*",
    "ruff==0.6.*",
    "mypy==1.11.*",
    "types-passlib==1.7.*",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "alembic*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "ANN", "T20", "PTH", "ERA", "PL", "TRY", "SIM", "RET"]
ignore = ["ANN101", "ANN102", "ARG001", "ARG002", "B008", "PLW0603", "PTH123", "TRY003", "SIM117"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
namespace_packages = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]