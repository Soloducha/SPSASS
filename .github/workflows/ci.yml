name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  TESTING: "1"

jobs:
  # ──────────────────────────────────────────────
  # Python API — lint + tests (autonomous, no services)
  # ──────────────────────────────────────────────
  python-api:
    name: Python API (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install API with dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint (pragmatic gate — app/ only)
        # Gate uses the rules configured in pyproject.toml (E,F,I,N,W,UP,B,C4,ANN,T20,PTH,ERA,PL,TRY,SIM,RET)
        # with style noise ignored globally (E501 line-length, E402 import position) and opinionated
        # ignores per-file (PLR2004 in tests, T201/PLR2004/PLR0915 in scripts). alembic/ excluded (auto-generated).
        # Intent: fail on issues with real value, not style wars.
        run: ruff check --exit-non-zero-on-fix app/

      - name: Mypy type check (app/ only)
        run: mypy app

      - name: Run tests (SQLite in-memory, no external services)
        run: pytest -v --tb=short

  # ──────────────────────────────────────────────
  # Go agent — vet + tests + static build
  # ──────────────────────────────────────────────
  go-agent:
    name: Go agent (vet + tests + static build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./agent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod

      - name: Go vet
        run: go vet ./...

      - name: Go tests
        run: go test ./...

      - name: Static build (CGO disabled)
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o spsaas-agent ./cmd/agent

  # ──────────────────────────────────────────────
  # Web dashboard — lint + typecheck
  # ──────────────────────────────────────────────
  # Why this job exists: docker-build compiles the web with `target: dev`
  # (docker-compose.yml), which installs deps and runs `pnpm dev` WITHOUT
  # compiling. `next build` is what runs the TypeScript check, so before this
  # job a type error in the dashboard could merge unnoticed — which is exactly
  # how PR #29 landed a broken AlertsTable.tsx.
  web:
    name: Web (lint + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        # Pinned to match the Dockerfile, which activates pnpm via corepack.
        with:
          version: 12.8.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Same major as web/Dockerfile's base image (node:24-alpine).
          node-version: '24'
          cache: pnpm
          cache-dependency-path: ./web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gate: real lint errors only. Style preferences are eslint-config-next's call.
      - name: ESLint
        run: pnpm run lint

      # `next build` runs the TypeScript compiler and fails on type errors.
      # This is the check docker-build cannot provide for the web.
      - name: Next build (includes TypeScript check)
        run: pnpm run build

  # ──────────────────────────────────────────────
  # Docker build — validates docker-compose builds
  # ──────────────────────────────────────────────
  docker-build:
    name: Docker build (compose)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all services (no push)
        run: docker compose build --parallel