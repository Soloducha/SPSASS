name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  TESTING: "1"

jobs:
  # ──────────────────────────────────────────────
  # Python API — lint + tests (autonomous, no services)
  # ──────────────────────────────────────────────
  python-api:
    name: Python API (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install API with dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint (errors only — E,F; ignore noisy style rules; app/ only)
        # pyproject.toml defines ~60 style warnings (line-length, imports, magic numbers, etc.).
        # CI fails on E/F functional errors but ignores noisy style: E402 (import position), E501 (line-length),
        # F401 (unused imports), F811 (redef), F821 (SQLAlchemy forward refs). alembic/ excluded (auto-generated).
        # Run `ruff check .` locally for full report. Goal: green CI, not style war.
        run: ruff check --select E,F --ignore E402,E501,F401,F811,F821 --exit-non-zero-on-fix app/

      - name: Run tests (SQLite in-memory, no external services)
        run: pytest -v --tb=short

  # ──────────────────────────────────────────────
  # Docker build — validates docker-compose builds
  # ──────────────────────────────────────────────
  docker-build:
    name: Docker build (compose)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all services (no push)
        run: docker compose build --parallel